<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FluneXy — Organiza tus finanzas personales</title>

  <!-- Bootstrap CSS — CDN oficial -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
</head>
<body class="bg-body-secondary">

  <!-- ══════════════ HERO — grid de 2 columnas en desktop ══════════════ -->
  <header class="bg-dark text-white">
    <div class="container py-5">
      <div class="row align-items-center g-4">

        <div class="col-12 col-lg-6">
          <span class="badge bg-primary-subtle text-primary-emphasis mb-3">
            Finanzas personales
          </span>
          <h1 class="display-5 fw-bold mb-3">
            Organiza tu dinero sin complicarte
          </h1>
          <p class="lead text-white-50 mb-4">
            FluneXy reúne tus ingresos, gastos y metas de ahorro en un solo
            lugar, para que sepas siempre en qué se va tu dinero — sin hojas
            de cálculo.
          </p>
          <a href="#caracteristicas" class="btn btn-primary btn-lg me-2">
            Comenzar gratis
          </a>
          <a href="#cta" class="btn btn-outline-light btn-lg">
            Ver más
          </a>
        </div>

        <div class="col-12 col-lg-6">
          <img
            src="https://placehold.co/640x420/0d6efd/ffffff?text=FluneXy"
            alt="Vista previa del panel de FluneXy"
            class="img-fluid rounded-4 shadow"
          >
        </div>

      </div>
    </div>
  </header>

  <!-- Bootstrap Bundle JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmAFQUTMaJfkxhKa5VJo93SWnOR"
    crossorigin="anonymous">
  </script>
</body>
</html>
